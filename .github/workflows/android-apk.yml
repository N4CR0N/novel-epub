name: Android APK (deneme)

# Geliştirme sırasında elle çalıştırılır: `gh workflow run android-apk.yml --ref <dal>`.
# Başarısız denemeler sahibine mail atmasın diye iş "continue-on-error"; sonucu özet ve çıktıdan oku.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"

      - name: Python kaynağını uygulamaya koy
        run: |
          rm -rf android/app/src/main/python && mkdir -p android/app/src/main/python
          cp -r novel_epub android/app/src/main/python/
          find android/app/src/main/python -name "__pycache__" -prune -exec rm -rf {} +
          echo 'SURUM = "dev"' > android/app/src/main/python/novel_epub/_surum.py

      - name: APK derle (deneme için üretilip atılan anahtarla, kalıcı imza yolunu sınar)
        env:
          APP_VERSION_NAME: dev
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deneme.jks"
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -storetype PKCS12 -alias webnovel -keyalg RSA -keysize 2048 \
            -validity 3650 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname "CN=deneme" >/dev/null
          gradle -p android assembleRelease --stacktrace
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -E "Signer #1 certificate DN" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: İmzasız derle, kalıcı anahtarla yalnız apksigner imzalasın (yayın hattının aynısı)
        env:
          APP_VERSION_NAME: dev
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_UNSIGNED: "1"
        run: |
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/unsigned.apk"
      - name: İmzala
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Kalıcı anahtar: gizli değer YOK" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          umask 077
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/webnovel.jks"
          printf '%s' "$KS_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > "$RUNNER_TEMP/ks.pass"
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          if "$BT/apksigner" sign --ks "$RUNNER_TEMP/webnovel.jks" --ks-key-alias webnovel \
               --ks-pass "file:$RUNNER_TEMP/ks.pass" --key-pass "file:$RUNNER_TEMP/ks.pass" \
               --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"; then
            "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | grep -E "certificate SHA-1 digest" | sed 's/^/Kalıcı anahtar: /' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Kalıcı anahtar: imzalanamadı" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RUNNER_TEMP/webnovel.jks" "$RUNNER_TEMP/ks.pass"

      - name: Sonuç
        if: always()
        run: |
          f=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            cp "$f" WebNovelDownloaderTranslator.apk
            echo "APK: $(du -h WebNovelDownloaderTranslator.apk | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "APK üretilmedi" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: WebNovelDownloaderTranslator-apk
          path: WebNovelDownloaderTranslator.apk
          if-no-files-found: ignore

  emulator:
    # Aynı uygulamayı emülatörde açar: Python sunucusu kalkıyor mu, arayüz geliyor mu?
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: x86_64 APK
        env:
          EXTRA_ABI: x86_64
          APP_VERSION_NAME: test
        run: |
          rm -rf android/app/src/main/python && mkdir -p android/app/src/main/python
          cp -r novel_epub android/app/src/main/python/
          echo 'SURUM = "test"' > android/app/src/main/python/novel_epub/_surum.py
          gradle -p android assembleRelease
      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/emulator-smoke.sh
