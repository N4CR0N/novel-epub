name: Android APK (deneme)

# Geliştirme sırasında elle çalıştırılır: `gh workflow run android-apk.yml --ref <dal>`.
# Başarısız denemeler sahibine mail atmasın diye iş "continue-on-error"; sonucu özet ve çıktıdan oku.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Python kaynağını uygulamaya koy
        run: |
          rm -rf android/app/src/main/python && mkdir -p android/app/src/main/python
          cp -r novel_epub android/app/src/main/python/
          find android/app/src/main/python -name "__pycache__" -prune -exec rm -rf {} +
          echo 'SURUM = "dev"' > android/app/src/main/python/novel_epub/_surum.py

      - name: APK derle
        env:
          APP_VERSION_NAME: dev
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --stacktrace

      - name: Sonuç
        if: always()
        run: |
          f=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            cp "$f" WebNovelDownloaderTranslator.apk
            echo "APK: $(du -h WebNovelDownloaderTranslator.apk | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "APK üretilmedi" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WebNovelDownloaderTranslator-apk
          path: WebNovelDownloaderTranslator.apk
          if-no-files-found: ignore
