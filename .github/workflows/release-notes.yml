name: Rewrite release notes in English

# One-off: replaces the (Turkish) notes of the releases published before English notes were introduced.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rewrite notes
        shell: bash
        run: |
          set -euo pipefail
          head="Windows app: download the **.exe** below and double-click it (no installation needed).
          The exe is unsigned. If Windows warns you, choose **More info → Run anyway**, or right-click the file → Properties → Unblock."
          note() {
            local tag=$1 body=$2
            gh release view "$tag" >/dev/null 2>&1 || { echo "$tag not found, skipped"; return; }
            printf '%s\n\n%s\n' "$head" "$body" > notes.md
            gh release edit "$tag" --notes-file notes.md
            echo "$tag updated" >> "$GITHUB_STEP_SUMMARY"
          }
          note v1.1.2 "### Changes
          - The version number is shown in the app, under its name
          - Every release is now published as its own version; older builds (v0.1.0–v1.1.1) were added to the list"
          note v1.1.1 "Built on 14 November 2026.

          ### Changes
          - Gap repair: short name/number lines that stay identical to the source no longer count as untranslated"
          note v1.1.0 "Built on 14 November 2026.

          ### Changes
          - Size 107 MB → 13.9 MB with the same features (own lightweight AI client instead of LiteLLM, no lxml/EbookLib/python-docx)
          - Automatic gap repair: paragraphs left in the source language are detected and only those are retranslated
          - Light blue colours; theme (light / dark / system) and interface language (Türkçe, English, Deutsch, Español, Русский) at the top right
          - The window opens maximised and remembers its size; two columns on wide screens"
          note v1.0.0 "New name: WebNovel Downloader & Translator. Built on 14 November 2026 (106 MB).

          ### Changes
          - Multiple AI providers: paste a key and the provider and its models are detected and ranked best to worst (Gemini, OpenAI, Claude, DeepSeek, OpenRouter, Groq…)
          - New sites: libread, readwn / fanmtl / wuxiabox, novelbuddy, wattpad
          - New, cleaner interface
          - The library and settings of the old Novel EPUB version are used as they are"
          note v0.2.1 "Built on 21 October 2026 (then called Novel EPUB).

          ### Changes
          - Read the browser history of a rooted Android phone (USB + adb) to find novel sites"
          note v0.2.0 "Built on 21 October 2026 (then called Novel EPUB).

          ### Changes
          - Books from files: EPUB, PDF, DOCX, TXT, MD, HTML
          - Choice of target language
          - New sites
          - Find novel sites in this computer's browser history"
          note v0.1.0 "First desktop release (then called Novel EPUB), built on 21 October 2026.

          ### Changes
          - Windows app that opens in its own window
          - Downloads from freewebnovel, novelbin, novelfull, royalroad and generic sites, with chapter checks
          - Gemini translation: model chain, quota-aware chapter batching, editing pass, story memory, formal/informal address table, glossary
          - A single EPUB as output"
