name: Windows uygulaması

on:
  push:
    branches: [main]
    paths:
      - "novel_epub/**"
      - "uygulama.py"
      - "requirements.txt"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/windows-uygulama.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller pytest

      - name: Testler
        run: python -m pytest -q

      - name: UPX indir (DLL sıkıştırma)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          "UPX_DIR=$PWD\upx-4.2.4-win64" | Out-File -Append $env:GITHUB_ENV

      - name: Exe derle
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WebNovelDownloaderTranslator
          --icon assets/icon.ico
          --add-data "novel_epub/templates;novel_epub/templates"
          --collect-all curl_cffi --collect-all webview --collect-data certifi
          --collect-submodules keyring --copy-metadata keyring
          --exclude-module tkinter --exclude-module unittest --exclude-module test --exclude-module pydoc_data
          --exclude-module setuptools --exclude-module pip --exclude-module lib2to3 --exclude-module idlelib
          --exclude-module ensurepip
          --upx-dir "${{ env.UPX_DIR }}" --upx-exclude vcruntime140.dll --upx-exclude python3.dll
          uygulama.py

      - name: Exe boyutu
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist\WebNovelDownloaderTranslator.exe).Length / 1MB, 2)
          "Exe boyutu: $mb MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Öz-test (pencere açmadan)
        shell: pwsh
        run: |
          $env:NOVEL_EPUB_HOME = "$env:RUNNER_TEMP\oztest"
          New-Item -ItemType Directory -Force $env:NOVEL_EPUB_HOME | Out-Null
          $p = Start-Process dist\WebNovelDownloaderTranslator.exe -ArgumentList "--oz-test" -Wait -PassThru
          Get-Content "$env:NOVEL_EPUB_HOME\oz-test.json"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Boyut dökümü (en büyük 25 parça)
        if: always()
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          from PyInstaller.archive.readers import CArchiveReader
          a = CArchiveReader("dist/WebNovelDownloaderTranslator.exe")
          rows = sorted(((v[1], v[2], k) for k, v in a.toc.items()), reverse=True)
          print(f"Toplam {sum(r[0] for r in rows) / 2**20:.2f} MB, {len(rows)} parça")
          for c, u, k in rows[:25]:
              print(f"{c / 2**20:7.2f} MB (açık {u / 2**20:6.2f})  {k}")
          z = a.open_embedded_archive("PYZ.pyz")
          by = {}
          for name, (_t, _o, n) in z.toc.items():
              top = name.split(".")[0]
              by[top] = by.get(top, 0) + n
          print("\nPYZ içindeki paketler (sıkıştırılmış, en büyük 40):")
          for top, n in sorted(by.items(), key=lambda x: -x[1])[:40]:
              print(f"{n / 2**10:8.0f} KB  {top}")

      - uses: actions/upload-artifact@v4
        with:
          name: WebNovelDownloaderTranslator
          path: dist/WebNovelDownloaderTranslator.exe

      - name: "Sürüm sayfasına koy (etiket: son)"
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f son
          git push -f origin son

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: son
          name: WebNovel Downloader & Translator — son sürüm
          body: |
            Windows uygulaması. WebNovelDownloaderTranslator.exe'yi indir ve çift tıkla (kurulum gerekmez).
            Eski "Novel EPUB" sürümünün kitaplığı ve ayarları olduğu gibi kullanılır.
            Derleme: ${{ github.sha }}
          files: dist/WebNovelDownloaderTranslator.exe
          make_latest: true
