name: Windows uygulaması

on:
  push:
    branches: [main]
    paths:
      - "novel_epub/**"
      - "uygulama.py"
      - "uygulama.spec"
      - "VERSION"
      - "requirements.txt"
      - "requirements-ci.txt"
      - "assets/**"
      - "tests/**"
      - "android/**"
      - ".github/workflows/windows-uygulama.yml"
  workflow_dispatch:

# Varsayılan yalnız okuma; sürüme yazan işler kendi yetkisini ister.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      v: ${{ steps.surum.outputs.v }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # sürüm etiketleri ve değişiklik listesi için

      - name: Google istemci kimliği (Drive girişi; depoda yok)
        shell: bash
        env:
          GCID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GCSEC: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$GCID" ]; then echo "Google istemci kimliği yok: Drive bu derlemede kapalı"; exit 0; fi
          python3 -c "import os, json; open('novel_epub/_google.py', 'w').write('CLIENT_ID = %s\nCLIENT_SECRET = %s\n' % (json.dumps(os.environ['GCID'].strip()), json.dumps(os.environ['GCSEC'].strip())))" || \
          python -c "import os, json; open('novel_epub/_google.py', 'w').write('CLIENT_ID = %s\nCLIENT_SECRET = %s\n' % (json.dumps(os.environ['GCID'].strip()), json.dumps(os.environ['GCSEC'].strip())))"
          echo "Google istemci kimliği eklendi"

      - name: Sürüm numarası
        id: surum
        shell: bash
        run: |
          base=$(tr -d '[:space:]' < VERSION)          # ör. 1.1 → v1.1.0, v1.1.1, …
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          v="$base.$(( ${last:--1} + 1 ))"
          [ "$GITHUB_REF" = "refs/heads/main" ] || v="$v-dev"
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -v -- -dev | head -1 || true)
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "SURUM = \"$v\"" > novel_epub/_surum.py
          {
            echo "**Windows:** download **WebNovelDownloaderTranslator.exe** and double-click it (no installation needed). The exe is not code-signed yet, so Windows SmartScreen may warn you; compare the file's SHA-256 with the one below before running it (PowerShell: \`Get-FileHash .\\WebNovelDownloaderTranslator.exe\`)."
            echo
            echo "**Android:** on the phone, download **WebNovelDownloaderTranslator.apk** and open it (Android 7.0+, 64-bit). Allow installing from your browser once; updates install over the previous version and keep your library."
            echo
            echo "### Changes"
            # yalnız uygulamayı değiştiren commit'ler (.github/, CLAUDE.md ve README'ye dokunanlar listelenmez)
            for c in $(git rev-list ${prev:+$prev..}HEAD); do
              if git diff-tree --no-commit-id --name-only -r "$c" | grep -qvE '^(\.github/|CLAUDE\.md|README)'; then
                subj=$(git log -1 --format='%s' "$c")
                case "$subj" in CI:*|Notes:*|Merge*) continue ;; esac
                echo "- ${subj% \[skip ci\]}"
              fi
            done | head -40
          } > surum-notu.md
          echo "Sürüm: v$v (önceki: ${prev:-yok})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          # tam sürümler + özet (hash) doğrulaması: değiştirilmiş ya da ele geçirilmiş paket kurulmaz
          pip install --require-hashes --no-deps -r requirements-ci.txt

      - name: Testler
        run: python -m pytest -q

      - name: Exe derle
        run: pyinstaller --noconfirm uygulama.spec

      - name: Exe boyutu
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist\WebNovelDownloaderTranslator.exe).Length / 1MB, 2)
          "Exe boyutu: $mb MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $h = (Get-FileHash dist\WebNovelDownloaderTranslator.exe -Algorithm SHA256).Hash.ToLower()
          "`n### SHA-256`n- ``$h``  WebNovelDownloaderTranslator.exe" | Out-File -Append -Encoding utf8 surum-notu.md

      - name: Öz-test (pencere açmadan)
        shell: pwsh
        run: |
          $env:NOVEL_EPUB_HOME = "$env:RUNNER_TEMP\oztest"
          New-Item -ItemType Directory -Force $env:NOVEL_EPUB_HOME | Out-Null
          $p = Start-Process dist\WebNovelDownloaderTranslator.exe -ArgumentList "--oz-test" -Wait -PassThru
          Get-Content "$env:NOVEL_EPUB_HOME\oz-test.json"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Boyut dökümü (en büyük 25 parça)
        if: always()
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          from PyInstaller.archive.readers import CArchiveReader
          a = CArchiveReader("dist/WebNovelDownloaderTranslator.exe")
          rows = sorted(((v[1], v[2], k) for k, v in a.toc.items()), reverse=True)
          print(f"Toplam {sum(r[0] for r in rows) / 2**20:.2f} MB, {len(rows)} parça")
          for c, u, k in rows[:25]:
              print(f"{c / 2**20:7.2f} MB (açık {u / 2**20:6.2f})  {k}")
          z = a.open_embedded_archive("PYZ.pyz")
          by = {}
          for name, (_t, _o, n) in z.toc.items():
              top = name.split(".")[0]
              by[top] = by.get(top, 0) + n
          print("\nPYZ içindeki paketler (sıkıştırılmış, en büyük 40):")
          for top, n in sorted(by.items(), key=lambda x: -x[1])[:40]:
              print(f"{n / 2**10:8.0f} KB  {top}")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WebNovelDownloaderTranslator
          path: dist/WebNovelDownloaderTranslator.exe

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.surum.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.surum.outputs.v }}
          body_path: surum-notu.md
          files: dist/WebNovelDownloaderTranslator.exe
          make_latest: true

      - name: 'Eski "son" sürümünü kaldır (her sürüm artık ayrı)'
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view son >/dev/null 2>&1; then gh release delete son --cleanup-tag -y || true; fi

  android:
    # Telefon uygulaması: aynı sürüme APK olarak eklenir. Kalıcı imza anahtarı (ANDROID_KEYSTORE_B64 +
    # ANDROID_KEYSTORE_PASSWORD) yoksa APK yayımlanmaz. Anahtar yalnız imza adımına verilir: APK önce imzasız
    # derlenir (Gradle ve eklentileri anahtarı görmez), sonra Android SDK'nın apksigner'ıyla imzalanır.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: İmza anahtarı var mı
        id: k
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "İmza anahtarı yok: APK bu sürümde yayımlanmadı." | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.k.outputs.has == 'true'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.k.outputs.has == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.k.outputs.has == 'true'
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.k.outputs.has == 'true'
        with:
          gradle-version: "8.11.1"
      - name: Google istemci kimliği (Drive girişi; depoda yok)
        if: steps.k.outputs.has == 'true'
        shell: bash
        env:
          GCID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GCSEC: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$GCID" ]; then echo "Google istemci kimliği yok: Drive bu derlemede kapalı"; exit 0; fi
          python3 -c "import os, json; open('novel_epub/_google.py', 'w').write('CLIENT_ID = %s\nCLIENT_SECRET = %s\n' % (json.dumps(os.environ['GCID'].strip()), json.dumps(os.environ['GCSEC'].strip())))" || \
          python -c "import os, json; open('novel_epub/_google.py', 'w').write('CLIENT_ID = %s\nCLIENT_SECRET = %s\n' % (json.dumps(os.environ['GCID'].strip()), json.dumps(os.environ['GCSEC'].strip())))"
          echo "Google istemci kimliği eklendi"

      - name: APK derle (imzasız)
        if: steps.k.outputs.has == 'true'
        env:
          APP_VERSION_NAME: ${{ needs.build.outputs.v }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_UNSIGNED: "1"
        run: |
          rm -rf android/app/src/main/python && mkdir -p android/app/src/main/python
          cp -r novel_epub android/app/src/main/python/
          find android/app/src/main/python -name "__pycache__" -prune -exec rm -rf {} +
          echo "SURUM = \"$APP_VERSION_NAME\"" > android/app/src/main/python/novel_epub/_surum.py
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/unsigned.apk"
      - name: İmzala (yalnız Android SDK araçları)
        if: steps.k.outputs.has == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          umask 077
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/webnovel.jks"
          # apksigner aynı dosyadan iki parolayı ardışık satırlardan okur (--ks-pass, --key-pass)
          P=$(printf '%s' "$KS_PASS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          printf '%s\n%s\n' "$P" "$P" > "$RUNNER_TEMP/ks.pass"; unset P
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/webnovel.jks" --ks-key-alias webnovel \
            --ks-pass "file:$RUNNER_TEMP/ks.pass" --key-pass "file:$RUNNER_TEMP/ks.pass" \
            --out WebNovelDownloaderTranslator.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/webnovel.jks" "$RUNNER_TEMP/ks.pass"
          "$BT/apksigner" verify WebNovelDownloaderTranslator.apk
          echo "APK: $(du -h WebNovelDownloaderTranslator.apk | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo "- \`$(sha256sum WebNovelDownloaderTranslator.apk | cut -d' ' -f1)\`  WebNovelDownloaderTranslator.apk"; } > apk-ozet.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.k.outputs.has == 'true'
        with:
          tag_name: v${{ needs.build.outputs.v }}
          files: WebNovelDownloaderTranslator.apk
          body_path: apk-ozet.md
          append_body: true
