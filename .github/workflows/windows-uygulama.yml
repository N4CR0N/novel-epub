name: Windows uygulaması

on:
  push:
    branches: [main]
    paths:
      - "novel_epub/**"
      - "uygulama.py"
      - "requirements.txt"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/windows-uygulama.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview pyinstaller pytest

      - name: Testler
        run: python -m pytest -q

      - name: Exe derle
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WebNovelDownloaderTranslator
          --icon assets/icon.ico
          --add-data "novel_epub/templates;novel_epub/templates"
          --collect-all curl_cffi --collect-all webview --collect-data certifi
          --collect-submodules keyring --copy-metadata keyring
          --exclude-module tkinter --exclude-module unittest --exclude-module test --exclude-module pydoc_data
          --exclude-module setuptools --exclude-module pip --exclude-module lib2to3 --exclude-module idlelib
          --exclude-module ensurepip --exclude-module distutils
          uygulama.py

      - name: Exe boyutu
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist\WebNovelDownloaderTranslator.exe).Length / 1MB, 2)
          "Exe boyutu: $mb MB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Öz-test (pencere açmadan)
        shell: pwsh
        run: |
          $env:NOVEL_EPUB_HOME = "$env:RUNNER_TEMP\oztest"
          New-Item -ItemType Directory -Force $env:NOVEL_EPUB_HOME | Out-Null
          $p = Start-Process dist\WebNovelDownloaderTranslator.exe -ArgumentList "--oz-test" -Wait -PassThru
          Get-Content "$env:NOVEL_EPUB_HOME\oz-test.json"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: WebNovelDownloaderTranslator
          path: dist/WebNovelDownloaderTranslator.exe

      - name: "Sürüm sayfasına koy (etiket: son)"
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f son
          git push -f origin son

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: son
          name: WebNovel Downloader & Translator — son sürüm
          body: |
            Windows uygulaması. WebNovelDownloaderTranslator.exe'yi indir ve çift tıkla (kurulum gerekmez).
            Eski "Novel EPUB" sürümünün kitaplığı ve ayarları olduğu gibi kullanılır.
            Derleme: ${{ github.sha }}
          files: dist/WebNovelDownloaderTranslator.exe
          make_latest: true
