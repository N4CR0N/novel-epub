<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel → EPUB</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --fg:#1d1d1f; --mut:#6b6b70; --line:#e2e0db; --acc:#2f6fdb; --ok:#1f8a4c; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1e1e22; --fg:#ececee; --mut:#9a9aa2; --line:#2e2e34; --acc:#5b8ff0; --ok:#3fbf75; --err:#ef6b5b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.5rem; margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.88rem; color:var(--mut); margin:10px 0 4px; }
  input[type=text], input[type=number], input[type=password], select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font-size:1rem; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .check { display:flex; align-items:center; gap:8px; margin-top:12px; color:var(--fg); font-size:1rem; }
  button { padding:11px 16px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; width:0; background:var(--acc); transition:width .3s; }
  .mut { color:var(--mut); font-size:.88rem; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; max-height:300px; overflow:auto; font-size:.8rem; white-space:pre-wrap; margin:10px 0 0; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  a { color:var(--acc); }
  ul.books { list-style:none; padding:0; margin:0; } ul.books li { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); word-break:break-all; }
  details summary { cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Novel → EPUB</h1>

  <div class="card">
    <label for="url">Novel linki (ana sayfa ya da herhangi bir bölüm)</label>
    <input id="url" type="text" placeholder="https://freewebnovel.com/novel/..." autocomplete="off">
    <div class="row">
      <div><label for="start">İlk bölüm</label><input id="start" type="number" min="1" placeholder="1"></div>
      <div><label for="end">Son bölüm</label><input id="end" type="number" min="1" placeholder="sonuna kadar"></div>
    </div>
    <label class="check"><input id="translate" type="checkbox" checked> Türkçeye çevir (Gemini)</label>
    <div class="actions">
      <button id="go">Başlat</button>
      <button id="stop" class="ghost" disabled>Durdur</button>
    </div>
  </div>

  <div class="card" id="jobCard" hidden>
    <div><strong id="jTitle"></strong></div>
    <div class="mut" id="jPhase"></div>
    <div class="bar"><div id="jBar"></div></div>
    <div class="mut" id="jCount"></div>
    <div id="jResult"></div>
    <pre id="jLog"></pre>
  </div>

  <div class="card">
    <strong>Hazır kitaplar</strong>
    <ul class="books" id="books"></ul>
  </div>

  <div class="card">
    <details id="settings">
      <summary>Ayarlar</summary>
      <label for="key">Gemini API anahtarı <span class="mut" id="keyHint"></span></label>
      <input id="key" type="password" placeholder="aistudio.google.com/apikey adresinden ücretsiz al">
      <label for="model">Model(ler) — virgülle sırala; biri kotayı doldurunca sonrakine geçer</label>
      <div class="row"><input id="model" type="text" list="models"><button class="ghost" id="loadModels" style="flex:0 0 auto">Listele</button></div>
      <datalist id="models"></datalist>
      <div class="row">
        <div><label for="delay">İstek arası bekleme (sn)</label><input id="delay" type="number" step="0.1" min="0"></div>
        <div><label for="workers">Paralel indirme</label><input id="workers" type="number" min="1" max="8"></div>
      </div>
      <label for="batch">Bir istekte en fazla kaç bölüm (0 = otomatik: bölüm uzunluğuna göre)</label>
      <input id="batch" type="number" min="0" max="12">
      <div class="actions"><button id="saveSet">Kaydet</button><span class="mut" id="setMsg"></span></div>
    </details>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let jobId = null, timer = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

async function loadSettings() {
  const s = await api('/api/settings');
  $('model').value = s.model || ''; $('delay').value = s.delay; $('workers').value = s.workers; $('batch').value = s.batch ?? 0;
  $('keyHint').textContent = s.has_key ? '(kayıtlı ' + s.key_hint + ')' : '(kayıtlı değil)';
  if (!s.has_key) $('settings').open = true;
}

$('saveSet').onclick = async () => {
  try {
    await api('/api/settings', {api_key:$('key').value, model:$('model').value, delay:$('delay').value, workers:$('workers').value, batch:$('batch').value});
    $('key').value = ''; $('setMsg').textContent = 'Kaydedildi ✓'; loadSettings();
  } catch (e) { $('setMsg').textContent = e.message; }
};

$('loadModels').onclick = async () => {
  try {
    const d = await api('/api/models');
    $('models').innerHTML = d.models.map(m => `<option value="${esc(m)}">`).join('');
    $('setMsg').textContent = d.models.length + ' model bulundu; kutuya tıklayıp seç';
  } catch (e) { $('setMsg').textContent = e.message; }
};

async function loadBooks() {
  const b = await api('/api/books');
  $('books').innerHTML = b.length ? b.map(x => `<li><a href="/indir/${encodeURIComponent(x.name)}">${esc(x.name)}</a><span class="mut">${x.mb} MB</span></li>`).join('')
                                  : '<li class="mut">Henüz yok</li>';
}

$('go').onclick = async () => {
  try {
    const d = await api('/api/jobs', {url:$('url').value, start:$('start').value, end:$('end').value, translate:$('translate').checked});
    jobId = d.id; $('jobCard').hidden = false; $('jResult').innerHTML = '';
    $('go').disabled = true; $('stop').disabled = false;
    clearInterval(timer); timer = setInterval(poll, 1500); poll();
  } catch (e) { alert(e.message); }
};

$('stop').onclick = () => jobId && api(`/api/jobs/${jobId}/cancel`, {});

async function poll() {
  if (!jobId) return;
  const s = await api(`/api/jobs/${jobId}`);
  $('jTitle').textContent = s.title || 'Hazırlanıyor…';
  $('jPhase').textContent = s.phase;
  const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
  $('jBar').style.width = pct + '%';
  $('jCount').textContent = s.total ? `${s.done} / ${s.total} (%${pct})` : '';
  const log = $('jLog'), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.textContent = s.logs.join('\n'); if (atBottom) log.scrollTop = log.scrollHeight;
  if (!s.running) {
    clearInterval(timer); $('go').disabled = false; $('stop').disabled = true;
    if (s.result) $('jResult').innerHTML = `<p class="ok">Hazır: <a href="/indir/${encodeURIComponent(s.result)}">${esc(s.result)}</a></p>`;
    if (s.error) $('jResult').innerHTML += `<p class="err">${esc(s.error)}</p>`;
    loadBooks();
  }
}

loadSettings(); loadBooks();
</script>
</body>
</html>
